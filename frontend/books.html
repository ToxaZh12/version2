<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Books CRUD</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="container">
    <h1>Books</h1>
    <div class="card">
      <h3>Add / Edit Book</h3>
      <form id="bookForm">
        <input type="hidden" id="bookId">
        <label>Title <input id="title" required minlength="3"></label>
        <label>Pages <input id="pages" type="number" min="1" required></label>
        <label>Published at <input id="published_at" type="date"></label>
        <label>Author <input id="author" required minlength="3"></label>
        <label>Rating (1-10) <input id="rating" type="number" min="1" max="10"></label>
        <label>ISBN <input id="isbn"></label>
        <div class="row">
          <button type="submit">Save</button>
          <button type="button" id="resetBtn">Reset</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3>Books list</h3>
      <table class="table" id="booksTable">
        <thead><tr><th>ID</th><th>Title</th><th>Pages</th><th>Author</th><th>Published</th><th>Rating</th><th>ISBN</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

<script>
const apiBase = '/api/books';

async function fetchBooks(){
  const res = await fetch(apiBase);
  const data = await res.json();
  const tbody = document.querySelector('#booksTable tbody');
  tbody.innerHTML = '';
  data.forEach(b => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${b.id}</td>
      <td>${escapeHtml(b.title)}</td>
      <td>${b.pages}</td>
      <td>${escapeHtml(b.author)}</td>
      <td>${b.published_at || ''}</td>
      <td>${b.rating || ''}</td>
      <td>${b.isbn || ''}</td>
      <td class="actions">
        <button data-id="${b.id}" class="edit">Edit</button>
        <button data-id="${b.id}" class="del">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function escapeHtml(s){ if(!s) return ''; return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

document.getElementById('booksTable').addEventListener('click', async (e) => {
  if (e.target.classList.contains('del')) {
    const id = e.target.dataset.id;
    if (!confirm('Delete book #' + id + '?')) return;
    const res = await fetch(apiBase + '/' + id, { method:'DELETE' });
    if (res.status === 204) fetchBooks();
    else alert('Delete failed');
  } else if (e.target.classList.contains('edit')) {
    const id = e.target.dataset.id;
    const res = await fetch(apiBase + '/' + id);
    if (res.ok) {
      const b = await res.json();
      document.getElementById('bookId').value = b.id;
      document.getElementById('title').value = b.title;
      document.getElementById('pages').value = b.pages;
      document.getElementById('published_at').value = b.published_at ? b.published_at.split('T')[0] : '';
      document.getElementById('author').value = b.author;
      document.getElementById('rating').value = b.rating || '';
      document.getElementById('isbn').value = b.isbn || '';
    } else alert('Load failed');
  }
});

document.getElementById('bookForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('bookId').value;
  const payload = {
    title: document.getElementById('title').value,
    pages: Number(document.getElementById('pages').value),
    published_at: document.getElementById('published_at').value || null,
    author: document.getElementById('author').value,
    rating: document.getElementById('rating').value ? Number(document.getElementById('rating').value) : null,
    isbn: document.getElementById('isbn').value || null
  };
  const method = id ? 'PUT' : 'POST';
  const url = id ? apiBase + '/' + id : apiBase;
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (res.ok) {
    fetchBooks();
    document.getElementById('resetBtn').click();
  } else {
    const err = await res.json();
    alert('Error: ' + JSON.stringify(err));
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('bookId').value = '';
  document.getElementById('title').value = '';
  document.getElementById('pages').value = '';
  document.getElementById('published_at').value = '';
  document.getElementById('author').value = '';
  document.getElementById('rating').value = '';
  document.getElementById('isbn').value = '';
});

fetchBooks();
</script>
</body>
</html>
